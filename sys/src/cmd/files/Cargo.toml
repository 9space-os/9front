# SPDX-License-Identifier: MIT
# files: a file manager on ui(4) through uiview (sys/src/libui/rust). Part
# of the workspace in sys/src/rust.
[package]
name = "files"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
workspace = "../../rust"

[dependencies]
uiview = { path = "../../libui/rust" }

[lints.rust]
# a host's rustc (cargo test) does not know the plan9 target
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("plan9"))'] }
